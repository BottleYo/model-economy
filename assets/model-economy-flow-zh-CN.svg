<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
<title id="title">Model Economy v0.7.0</title>
<desc id="desc">先看风险，再选路线。按下表从上往下匹配，不是每次都走四遍。</desc>
<rect width="1440" height="1060" fill="#f5f2eb"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="48" y="65" font-size="34" fill="#202a2a" font-weight="700">MODEL ECONOMY</text>
<text x="1220" y="63" font-size="22" fill="#41675d" font-weight="400">v0.7.0</text>
<text x="48" y="125" font-size="36" fill="#202a2a" font-weight="700">小改动别开大会，难题再请强模型。</text>
<text x="48" y="164" font-size="20" fill="#52615e" font-weight="400">先看风险，再选路线。按下表从上往下匹配，不是每次都走四遍。</text>
<text x="70" y="217" font-size="18" fill="#52615e" font-weight="700">碰到什么活儿</text>
<text x="496" y="217" font-size="18" fill="#52615e" font-weight="700">怎么安排</text>
<text x="978" y="217" font-size="18" fill="#52615e" font-weight="700">检查不能省</text>
<g data-route="large-high-risk">
<rect id="large-high-risk-0" x="48" y="236" width="416" height="113" rx="8" fill="#ffffff"/>
<rect id="large-high-risk-1" x="474" y="236" width="470" height="113" rx="8" fill="#e4eee8"/>
<rect id="large-high-risk-2" x="954" y="236" width="438" height="113" rx="8" fill="#ffffff"/>
<text x="70" y="274" font-size="23" fill="#202a2a" font-weight="700" data-fit="large-high-risk-0">01  大型 / 高风险</text>
<text x="70" y="312" font-size="19" fill="#52615e" font-weight="400" data-fit="large-high-risk-0">例如：权限调整、新架构</text>
<text x="496" y="274" font-size="22" fill="#202a2a" font-weight="400" data-fit="large-high-risk-1">strong 架构 → balanced 实现</text>
<text x="496" y="312" font-size="20" fill="#41675d" font-weight="400" data-fit="large-high-risk-1">→ strong 独立终审</text>
<text x="978" y="274" font-size="21" fill="#202a2a" font-weight="400" data-fit="large-high-risk-2">先确认设计，再看交付证据</text>
<text x="978" y="312" font-size="19" fill="#52615e" font-weight="400" data-fit="large-high-risk-2">需要健康增强与角色隔离</text>
</g>
<g data-route="mechanical">
<rect id="mechanical-0" x="48" y="361" width="416" height="113" rx="8" fill="#ffffff"/>
<rect id="mechanical-1" x="474" y="361" width="470" height="113" rx="8" fill="#e4eee8"/>
<rect id="mechanical-2" x="954" y="361" width="438" height="113" rx="8" fill="#ffffff"/>
<text x="70" y="399" font-size="23" fill="#202a2a" font-weight="700" data-fit="mechanical-0">02  机械任务</text>
<text x="70" y="437" font-size="19" fill="#52615e" font-weight="400" data-fit="mechanical-0">例如：有固定规则的批量修改</text>
<text x="496" y="399" font-size="22" fill="#202a2a" font-weight="400" data-fit="mechanical-1">五项机械条件全部满足</text>
<text x="496" y="437" font-size="20" fill="#41675d" font-weight="400" data-fit="mechanical-1">才考虑 economy 批处理</text>
<text x="978" y="399" font-size="21" fill="#202a2a" font-weight="400" data-fit="mechanical-2">每一项都要能验证</text>
<text x="978" y="437" font-size="19" fill="#52615e" font-weight="400" data-fit="mechanical-2">不满足条件就不硬降档</text>
</g>
<g data-route="simple">
<rect id="simple-0" x="48" y="486" width="416" height="113" rx="8" fill="#ffffff"/>
<rect id="simple-1" x="474" y="486" width="470" height="113" rx="8" fill="#e4eee8"/>
<rect id="simple-2" x="954" y="486" width="438" height="113" rx="8" fill="#ffffff"/>
<text x="70" y="524" font-size="23" fill="#202a2a" font-weight="700" data-fit="simple-0">03  简单任务</text>
<text x="70" y="562" font-size="19" fill="#52615e" font-weight="400" data-fit="simple-0">例如：已知配置，改完可直接查</text>
<text x="496" y="524" font-size="22" fill="#202a2a" font-weight="400" data-fit="simple-1">当前会话直接处理</text>
<text x="496" y="562" font-size="20" fill="#41675d" font-weight="400" data-fit="simple-1">不新开子任务</text>
<text x="978" y="524" font-size="21" fill="#202a2a" font-weight="400" data-fit="simple-2">做完运行对应检查</text>
<text x="978" y="562" font-size="19" fill="#52615e" font-weight="400" data-fit="simple-2">改一行，不用凑一桌人</text>
</g>
<g data-route="standard">
<rect id="standard-0" x="48" y="611" width="416" height="113" rx="8" fill="#ffffff"/>
<rect id="standard-1" x="474" y="611" width="470" height="113" rx="8" fill="#e4eee8"/>
<rect id="standard-2" x="954" y="611" width="438" height="113" rx="8" fill="#ffffff"/>
<text x="70" y="649" font-size="23" fill="#202a2a" font-weight="700" data-fit="standard-0">04  标准任务</text>
<text x="70" y="687" font-size="19" fill="#52615e" font-weight="400" data-fit="standard-0">其余普通开发、已知行为的修复</text>
<text x="496" y="649" font-size="22" fill="#202a2a" font-weight="400" data-fit="standard-1">主会话或 balanced 实现</text>
<text x="496" y="687" font-size="20" fill="#41675d" font-weight="400" data-fit="standard-1">探索、审查按需要加入</text>
<text x="978" y="649" font-size="21" fill="#202a2a" font-weight="400" data-fit="standard-2">检查范围跟着风险走</text>
<text x="978" y="687" font-size="19" fill="#52615e" font-weight="400" data-fit="standard-2">有具体能力不匹配可提早诊断</text>
</g>
<rect id="left" x="48" y="763" width="662" height="173" rx="8" fill="#e9e3d7"/>
<text x="70" y="800" font-size="22" fill="#202a2a" font-weight="700" data-fit="left">侧边栏任务：先授权，再开工</text>
<text x="70" y="838" font-size="19" fill="#202a2a" font-weight="400" data-fit="left">机械 / 标准任务可按条件派发；需宿主支持。</text>
<text x="70" y="868" font-size="19" fill="#202a2a" font-weight="400" data-fit="left">模型与推理强度分别请求；被拒绝就停。</text>
<text x="70" y="898" font-size="19" fill="#202a2a" font-weight="400" data-fit="left">直接修补优先回原任务，不重讲整部前传。</text>
<rect id="right" x="730" y="763" width="662" height="173" rx="8" fill="#e9e3d7"/>
<text x="752" y="800" font-size="22" fill="#202a2a" font-weight="700" data-fit="right">同一个工作包，共用一本账</text>
<text x="752" y="838" font-size="19" fill="#202a2a" font-weight="400" data-fit="right">最多 3 个新执行上下文 / 6 次执行请求。</text>
<text x="752" y="868" font-size="19" fill="#202a2a" font-weight="400" data-fit="right">默认并发 2；继续与重试也计数。</text>
<text x="752" y="898" font-size="19" fill="#202a2a" font-weight="400" data-fit="right">这是策略级上限，不是平台强制额度。</text>
<text x="48" y="980" font-size="18" fill="#52615e" font-weight="400">角色路线描述健康增强模式。核心模式不调用缺失角色；高风险缺隔离先停。</text>
<text x="48" y="1015" font-size="18" fill="#52615e" font-weight="400">真实可见任务创建、续改与复杂并行尚未实测；不承诺固定 Token 节省。</text>
</g>
</svg>
