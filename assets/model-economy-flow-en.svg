<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
<title id="title">Model Economy v0.7.0</title>
<desc id="desc">Check risk first. Take the first matching route below, not all four.</desc>
<rect width="1440" height="1060" fill="#f5f2eb"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="48" y="65" font-size="34" fill="#202a2a" font-weight="700">MODEL ECONOMY</text>
<text x="1220" y="63" font-size="22" fill="#41675d" font-weight="400">v0.7.0</text>
<text x="48" y="125" font-size="36" fill="#202a2a" font-weight="700">A tiny edit should not need a committee.</text>
<text x="48" y="164" font-size="20" fill="#52615e" font-weight="400">Check risk first. Take the first matching route below, not all four.</text>
<text x="70" y="217" font-size="18" fill="#52615e" font-weight="700">THE JOB</text>
<text x="496" y="217" font-size="18" fill="#52615e" font-weight="700">WHO HANDLES IT</text>
<text x="978" y="217" font-size="18" fill="#52615e" font-weight="700">WHAT GETS CHECKED</text>
<g data-route="large-high-risk">
<rect id="large-high-risk-0" x="48" y="236" width="416" height="113" rx="8" fill="#ffffff"/>
<rect id="large-high-risk-1" x="474" y="236" width="470" height="113" rx="8" fill="#e4eee8"/>
<rect id="large-high-risk-2" x="954" y="236" width="438" height="113" rx="8" fill="#ffffff"/>
<text x="70" y="274" font-size="23" fill="#202a2a" font-weight="700" data-fit="large-high-risk-0">01  LARGE / HIGH RISK</text>
<text x="70" y="312" font-size="19" fill="#52615e" font-weight="400" data-fit="large-high-risk-0">Permissions or new architecture</text>
<text x="496" y="274" font-size="22" fill="#202a2a" font-weight="400" data-fit="large-high-risk-1">strong design / balanced build</text>
<text x="496" y="312" font-size="20" fill="#41675d" font-weight="400" data-fit="large-high-risk-1">strong independent final review</text>
<text x="978" y="274" font-size="21" fill="#202a2a" font-weight="400" data-fit="large-high-risk-2">Approve design; verify evidence</text>
<text x="978" y="312" font-size="19" fill="#52615e" font-weight="400" data-fit="large-high-risk-2">Healthy enhancement + isolation</text>
</g>
<g data-route="mechanical">
<rect id="mechanical-0" x="48" y="361" width="416" height="113" rx="8" fill="#ffffff"/>
<rect id="mechanical-1" x="474" y="361" width="470" height="113" rx="8" fill="#e4eee8"/>
<rect id="mechanical-2" x="954" y="361" width="438" height="113" rx="8" fill="#ffffff"/>
<text x="70" y="399" font-size="23" fill="#202a2a" font-weight="700" data-fit="mechanical-0">02  MECHANICAL</text>
<text x="70" y="437" font-size="19" fill="#52615e" font-weight="400" data-fit="mechanical-0">Repeated edits with fixed rules</text>
<text x="496" y="399" font-size="22" fill="#202a2a" font-weight="400" data-fit="mechanical-1">All five conditions must hold</text>
<text x="496" y="437" font-size="20" fill="#41675d" font-weight="400" data-fit="mechanical-1">before economy batch work</text>
<text x="978" y="399" font-size="21" fill="#202a2a" font-weight="400" data-fit="mechanical-2">Check every result</text>
<text x="978" y="437" font-size="19" fill="#52615e" font-weight="400" data-fit="mechanical-2">No forced downgrade</text>
</g>
<g data-route="simple">
<rect id="simple-0" x="48" y="486" width="416" height="113" rx="8" fill="#ffffff"/>
<rect id="simple-1" x="474" y="486" width="470" height="113" rx="8" fill="#e4eee8"/>
<rect id="simple-2" x="954" y="486" width="438" height="113" rx="8" fill="#ffffff"/>
<text x="70" y="524" font-size="23" fill="#202a2a" font-weight="700" data-fit="simple-0">03  SIMPLE</text>
<text x="70" y="562" font-size="19" fill="#52615e" font-weight="400" data-fit="simple-0">Known setting, direct check</text>
<text x="496" y="524" font-size="22" fill="#202a2a" font-weight="400" data-fit="simple-1">Handle it in the current task</text>
<text x="496" y="562" font-size="20" fill="#41675d" font-weight="400" data-fit="simple-1">No new subtask</text>
<text x="978" y="524" font-size="21" fill="#202a2a" font-weight="400" data-fit="simple-2">Run the relevant check</text>
<text x="978" y="562" font-size="19" fill="#52615e" font-weight="400" data-fit="simple-2">No committee required</text>
</g>
<g data-route="standard">
<rect id="standard-0" x="48" y="611" width="416" height="113" rx="8" fill="#ffffff"/>
<rect id="standard-1" x="474" y="611" width="470" height="113" rx="8" fill="#e4eee8"/>
<rect id="standard-2" x="954" y="611" width="438" height="113" rx="8" fill="#ffffff"/>
<text x="70" y="649" font-size="23" fill="#202a2a" font-weight="700" data-fit="standard-0">04  STANDARD</text>
<text x="70" y="687" font-size="19" fill="#52615e" font-weight="400" data-fit="standard-0">Other ordinary development</text>
<text x="496" y="649" font-size="22" fill="#202a2a" font-weight="400" data-fit="standard-1">Main task or balanced build</text>
<text x="496" y="687" font-size="20" fill="#41675d" font-weight="400" data-fit="standard-1">Explore / review when needed</text>
<text x="978" y="649" font-size="21" fill="#202a2a" font-weight="400" data-fit="standard-2">Match checks to the risk</text>
<text x="978" y="687" font-size="19" fill="#52615e" font-weight="400" data-fit="standard-2">Evidence can trigger diagnosis</text>
</g>
<rect id="left" x="48" y="763" width="662" height="173" rx="8" fill="#e9e3d7"/>
<text x="70" y="800" font-size="22" fill="#202a2a" font-weight="700" data-fit="left">VISIBLE TASKS NEED PERMISSION</text>
<text x="70" y="838" font-size="19" fill="#202a2a" font-weight="400" data-fit="left">Mechanical / standard work; host support required.</text>
<text x="70" y="868" font-size="19" fill="#202a2a" font-weight="400" data-fit="left">Request model and reasoning; stop if rejected.</text>
<text x="70" y="898" font-size="19" fill="#202a2a" font-weight="400" data-fit="left">Reuse the task for a direct fix. Skip the recap.</text>
<rect id="right" x="730" y="763" width="662" height="173" rx="8" fill="#e9e3d7"/>
<text x="752" y="800" font-size="22" fill="#202a2a" font-weight="700" data-fit="right">ONE WORK PACKAGE, ONE BUDGET</text>
<text x="752" y="838" font-size="19" fill="#202a2a" font-weight="400" data-fit="right">Up to 3 new contexts / 6 execution requests.</text>
<text x="752" y="868" font-size="19" fill="#202a2a" font-weight="400" data-fit="right">Default concurrency: 2. Follow-ups count too.</text>
<text x="752" y="898" font-size="19" fill="#202a2a" font-weight="400" data-fit="right">Policy-level caps, not platform quotas.</text>
<text x="48" y="980" font-size="18" fill="#52615e" font-weight="400">Role routes assume healthy enhancement. Core mode has no custom roles; high-risk isolation gates remain.</text>
<text x="48" y="1015" font-size="18" fill="#52615e" font-weight="400">Live visible-task trials remain unverified. No fixed token-savings promise.</text>
</g>
</svg>
